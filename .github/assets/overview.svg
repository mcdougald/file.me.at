<svg xmlns="http://www.w3.org/2000/svg" width="880" height="281" viewBox="0 0 880 281" role="img" aria-label="file.me.at at a glance: Nothing uploaded, 14 PDF tools, Passwords kept, A matrix you can trust">
<rect x="0.5" y="0.5" width="879" height="280" rx="12" fill="#ffffff" stroke="#e5e5e5"/>
<rect x="24" y="24" width="196" height="233" rx="10" fill="#fafafa" stroke="#e5e5e5"/>
<text x="44" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#a3a3a3">01</text>
<line x1="72" y1="56" x2="200" y2="56" stroke="#d4d4d4" stroke-width="1"/>
<text x="44" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#0a0a0a" font-weight="600"><tspan x="44" dy="0">Nothing</tspan><tspan x="44" dy="22">uploaded</tspan></text>
<text x="44" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#525252"><tspan x="44" dy="0">Every tool runs in a</tspan><tspan x="44" dy="21">Web Worker on your</tspan><tspan x="44" dy="21">device. No account,</tspan><tspan x="44" dy="21">no upload, and it</tspan><tspan x="44" dy="21">works offline.</tspan></text>
<rect x="236" y="24" width="196" height="233" rx="10" fill="#fafafa" stroke="#e5e5e5"/>
<text x="256" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#a3a3a3">02</text>
<line x1="284" y1="56" x2="412" y2="56" stroke="#d4d4d4" stroke-width="1"/>
<text x="256" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#0a0a0a" font-weight="600"><tspan x="256" dy="0">14 PDF tools</tspan></text>
<text x="256" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#525252"><tspan x="256" dy="0">Merge, split,</tspan><tspan x="256" dy="21">reorder, rotate,</tspan><tspan x="256" dy="21">compress, protect,</tspan><tspan x="256" dy="21">unlock, watermark,</tspan><tspan x="256" dy="21">page numbers and</tspan><tspan x="256" dy="21">more.</tspan></text>
<rect x="448" y="24" width="196" height="233" rx="10" fill="#fafafa" stroke="#e5e5e5"/>
<text x="468" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#a3a3a3">03</text>
<line x1="496" y1="56" x2="624" y2="56" stroke="#d4d4d4" stroke-width="1"/>
<text x="468" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#0a0a0a" font-weight="600"><tspan x="468" dy="0">Passwords kept</tspan></text>
<text x="468" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#525252"><tspan x="468" dy="0">A locked PDF comes</tspan><tspan x="468" dy="21">back locked with the</tspan><tspan x="468" dy="21">same password. Only</tspan><tspan x="468" dy="21">the Unlock tool</tspan><tspan x="468" dy="21">removes it.</tspan></text>
<rect x="660" y="24" width="196" height="233" rx="10" fill="#fafafa" stroke="#e5e5e5"/>
<text x="680" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#a3a3a3">04</text>
<line x1="708" y1="56" x2="836" y2="56" stroke="#d4d4d4" stroke-width="1"/>
<text x="680" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#0a0a0a" font-weight="600"><tspan x="680" dy="0">A matrix you</tspan><tspan x="680" dy="22">can trust</tspan></text>
<text x="680" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#525252"><tspan x="680" dy="0">A format pair is</tspan><tspan x="680" dy="21">listed only when it</tspan><tspan x="680" dy="21">passes a written</tspan><tspan x="680" dy="21">acceptance contract.</tspan></text>
</svg>
