<svg xmlns="http://www.w3.org/2000/svg" width="880" height="232" viewBox="0 0 880 232" role="img" aria-label="How file.me.at works: Open, then Admit, then Process, then Download">
<rect x="0.5" y="0.5" width="879" height="231" rx="12" fill="#0a0a0a" stroke="#262626"/>
<rect x="24" y="24" width="187" height="145" rx="10" fill="#171717" stroke="#262626"/>
<text x="40" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#525252" opacity="1">01</text>
<text x="40" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#fafafa" font-weight="600"><tspan x="40" dy="0">Open</tspan></text>
<text x="40" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#a3a3a3"><tspan x="40" dy="0">Pick a file. It stays</tspan><tspan x="40" dy="19">in your browser.</tspan></text>
<path d="M217 96.5 H231" stroke="#525252" stroke-width="1.5"/><path d="M227 92.5 L233 96.5 L227 100.5" fill="none" stroke="#525252" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="239" y="24" width="187" height="145" rx="10" fill="#171717" stroke="#262626"/>
<text x="255" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#525252" opacity="1">02</text>
<text x="255" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#fafafa" font-weight="600"><tspan x="255" dy="0">Admit</tspan></text>
<text x="255" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#a3a3a3"><tspan x="255" dy="0">Header, page and</tspan><tspan x="255" dy="19">object limits checked</tspan><tspan x="255" dy="19">first.</tspan></text>
<path d="M432 96.5 H446" stroke="#525252" stroke-width="1.5"/><path d="M442 92.5 L448 96.5 L442 100.5" fill="none" stroke="#525252" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="454" y="24" width="187" height="145" rx="10" fill="#171717" stroke="#262626"/>
<text x="470" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#525252" opacity="1">03</text>
<text x="470" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#fafafa" font-weight="600"><tspan x="470" dy="0">Process</tspan></text>
<text x="470" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#a3a3a3"><tspan x="470" dy="0">A Web Worker runs the</tspan><tspan x="470" dy="19">PDF engine locally.</tspan></text>
<path d="M647 96.5 H661" stroke="#525252" stroke-width="1.5"/><path d="M657 92.5 L663 96.5 L657 100.5" fill="none" stroke="#525252" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="669" y="24" width="187" height="145" rx="10" fill="#fafafa"/>
<text x="685" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#0a0a0a" opacity="0.6">04</text>
<text x="685" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#0a0a0a" font-weight="600"><tspan x="685" dy="0">Download</tspan></text>
<text x="685" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#0a0a0a" opacity="0.8"><tspan x="685" dy="0">Save the result.</tspan><tspan x="685" dy="19">Nothing is kept.</tspan></text>

<text x="24" y="199" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#525252"><tspan x="24" dy="0">For scripts and servers, the conversion API does the same work server-side and writes nothing to disk.</tspan></text>
</svg>
